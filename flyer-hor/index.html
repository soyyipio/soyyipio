<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATOTERA - Flyer horizontal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232a0d4d'/%3E%3Ctext x='50' y='76' font-size='74' font-weight='900' font-family='Arial Narrow,Arial' text-anchor='middle' fill='%23e4c06a'%3EY%3C/text%3E%3C/svg%3E">
<link rel="preload" href="../fonts/GCGrind.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/flyer.css">
</head>
<body class="flyer">

<!-- Flyer horizontal (1920x1080). Se escala solo para entrar en la ventana.
     Para verlo a tamaño real (1 píxel = 1 píxel): agregar ?real a la URL.
     Las fotos salen de img/escenario/ (1 centro, 2 izquierda, 3 derecha). -->
<div class="lienzo lienzo--hor" id="lienzo" data-ancho="1920" data-alto="1080">
  <div class="reflector reflector--izq"></div>
  <div class="reflector reflector--purpura"></div>
  <div class="reflector reflector--der"></div>
  <div class="fl-piso"></div>
  <div class="telon telon--izq"></div>
  <div class="telon telon--der"></div>
  <div class="bambalina"></div>

  <div class="fl-titulo">
    <p class="fl-kicker">Stand-up comedy</p>
    <p class="fl-yipio">Yipio</p>
    <h1 class="fl-show texto-oro">Patotera</h1>
  </div>

  <div class="fl-fotos" data-carpeta="../img/escenario/">
    <img class="fl-foto fl-foto--izq" data-foto="2" alt="">
    <img class="fl-foto fl-foto--der" data-foto="3" alt="">
    <img class="fl-foto fl-foto--centro" data-foto="1" alt="Yipio">
  </div>

  <div class="fl-pie">
    <p class="fl-gira">Gira 2026/2027</p>
  </div>

  <canvas class="fl-destellos" id="destellos" data-ancho="1920" data-alto="1080" aria-hidden="true"></canvas>
</div>

<script src="../js/comun.js"></script>
<script src="../js/flyer.js"></script>
<script src="../js/destellos.js"></script>
<script src="../js/escenario.js"></script>
</body>
</html>
